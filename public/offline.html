<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8f2445">
<title>Offline · Saathi</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
    background:#fbfaf8;color:#1c1917;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
  main{max-width:24rem}
  h1{font-size:1.5rem;margin:0 0 .5rem}
  p{margin:0 0 1.5rem;color:#57534e;line-height:1.5}
  button{background:#8f2445;color:#fff;border:0;border-radius:.75rem;padding:.75rem 1.5rem;font-size:1rem;cursor:pointer}
  @media (prefers-color-scheme:dark){body{background:#0f0e0d;color:#f5f5f4}p{color:#a8a29e}button{background:#e0708f;color:#1a0d12}}
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>Saathi needs an internet connection to show profiles and messages. Your details stay private and are not stored on this device.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
